# ForgeOS governance policies for Google Gemini CLI.
# Loaded via policyPaths in .gemini/settings.json.

# 1. Require explicit user confirmation for sensitive shell commands.
[[rule]]
toolName = "run_shell_command"
commandPrefix = [
  "docker push",
  "eas submit",
  "eas update",
  "gh release",
  "git merge",
  "git push",
  "git tag",
  "kubectl apply",
  "kubectl delete",
  "npm publish",
  "terraform apply",
  "terraform destroy",
]
decision = "ask_user"
priority = 200
modes = ["default", "autoEdit"]

# 2. Deny reading or writing actual .env and .env.* secret files.
[[rule]]
toolName = ["read_file", "write_file", "replace"]
argsPattern = '"file_path":"([^"]*[/\\]|)\.env(\.(?!example"|sample"|template")[^"]+|[*?\[][^"]*|)"'
decision = "deny"
priority = 300
denyMessage = "Access to .env secret files is denied by ForgeOS policy."

[[rule]]
toolName = "read_many_files"
argsPattern = '"include":\[[^\]]*"([^"]*[/\\]|)\.env(\.(?!example"|sample"|template")[^"]+|[*?\[][^"]*|)"'
decision = "deny"
priority = 300
denyMessage = "Access to .env secret files is denied by ForgeOS policy."

# 3. Allow reading non-secret environment templates (.env.example, .env.sample, .env.template).
[[rule]]
toolName = "read_file"
argsPattern = '"file_path":"([^"]*[/\\]|)\.env\.(example|sample|template)"'
decision = "allow"
priority = 250

[[rule]]
toolName = "read_many_files"
argsPattern = '"include":\["([^"]*[/\\]|)\.env\.(example|sample|template)"\]'
decision = "allow"
priority = 250

# 4. Handle editing non-secret environment templates according to the active approval mode.
[[rule]]
toolName = ["write_file", "replace"]
argsPattern = '"file_path":"([^"]*[/\\]|)\.env\.(example|sample|template)"'
decision = "ask_user"
priority = 250
modes = ["default"]

[[rule]]
toolName = ["write_file", "replace"]
argsPattern = '"file_path":"([^"]*[/\\]|)\.env\.(example|sample|template)"'
decision = "allow"
priority = 250
modes = ["autoEdit"]
